<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restock Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#121833; --wall:#1A2246; --shelf:#2A3466; --ledge:#3A4685; --ledge-top:#4C5AA3;
  --lamp:#FFB238; --lamp-soft:rgba(255,178,56,.16); --dim:#7E89BE; --alert:#FF5D73;
  --paper:#EEF0FF; --muted:#A7AEDA; --line:rgba(167,174,218,.18);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 70% -10%,#26306180,transparent 70%),var(--night);
  color:var(--paper);font:400 15px/1.5 var(--body);min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:8px}
a{color:inherit}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  padding:14px clamp(16px,4vw,40px);background:rgba(18,24,51,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.cube{width:28px;height:28px;position:relative;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(38deg);animation:spin 14s linear infinite}
.cube i{position:absolute;inset:0;border:2px solid var(--lamp);background:rgba(255,178,56,.12)}
.cube i:nth-child(1){transform:translateZ(14px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(14px)}
.cube i:nth-child(3){transform:rotateY(180deg) translateZ(14px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(14px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(14px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(14px)}
@keyframes spin{to{transform:rotateX(-24deg) rotateY(398deg)}}
.brand h1{font:800 22px/1 var(--display);letter-spacing:-.02em;margin:0}
.pulse{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:var(--wall);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.pulse b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.pulse.live .dot{background:var(--lamp);box-shadow:0 0 0 0 var(--lamp);animation:ping 1.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{border:1px solid var(--line);background:var(--wall);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;
  transition:transform .15s,background .15s}
.btn:hover{background:var(--shelf)}.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--lamp);color:#2A1A00;border-color:transparent}
.btn.primary:hover{background:#FFC25E}
.btn[aria-pressed=true]{border-color:var(--lamp);color:var(--lamp)}
.top{position:sticky}@media (max-width:600px){.top{position:relative}}
.bar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--lamp);width:0;transition:width .4s ease}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;padding:28px clamp(16px,4vw,40px) 60px;max-width:1500px;margin:0 auto}
@media (max-width:1000px){main{grid-template-columns:1fr}}

/* ---------- add form ---------- */
.add{display:grid;grid-template-columns:1fr 170px 140px auto;gap:10px;margin-bottom:10px}
@media (max-width:760px){.add{grid-template-columns:1fr 1fr}.add .url{grid-column:1/-1}.add button{grid-column:1/-1}}
.add input{background:var(--wall);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-width:0}
.add input::placeholder{color:#7F87B5}
.add .url{font-size:16px}
.hint{color:var(--muted);font-size:13px;margin:0 0 26px}
.hint.err{color:var(--alert)}

.filters{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.chip[aria-pressed=true]{background:var(--paper);color:var(--night);border-color:var(--paper)}

/* ---------- shelf of 3D boxes ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:56px 26px;perspective:1100px}
.slot{position:relative;padding-bottom:22px}
.slot::after{content:"";position:absolute;left:-10px;right:-10px;bottom:0;height:16px;border-radius:3px;
  background:linear-gradient(var(--ledge-top),var(--ledge) 35%,var(--shelf));box-shadow:0 14px 22px -8px #0009}
.slot.in::before{content:"";position:absolute;left:10%;right:10%;top:-46px;height:150px;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0,var(--lamp-soft),transparent 70%)}
.box{position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .25s ease-out;border-radius:16px;background:linear-gradient(160deg,#2C3670,#222A57);
  border:1px solid var(--line);padding:18px 18px 16px;min-height:220px;display:flex;flex-direction:column;
  box-shadow:0 18px 30px -18px #000c, inset 0 1px 0 #ffffff14}
.slot.in .box{border-color:rgba(255,178,56,.55);box-shadow:0 18px 40px -16px rgba(255,178,56,.35), inset 0 1px 0 #ffffff22}
.slot.out .box{filter:saturate(.55) brightness(.86)}
.box > *{transform:translateZ(26px)}
.box .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.site{font-size:12px;font-weight:600;color:var(--muted);background:#ffffff0d;padding:3px 9px;border-radius:6px}
.lamp{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.lamp i{width:10px;height:10px;border-radius:50%;background:var(--dim)}
.slot.in .lamp{color:var(--lamp)} .slot.in .lamp i{background:var(--lamp);box-shadow:0 0 12px var(--lamp)}
.slot.out .lamp{color:#C9CEEF} .slot.unk .lamp{color:var(--muted)}
.box h3{font:700 18px/1.25 var(--display);margin:14px 0 6px;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font:800 28px/1.1 var(--display);margin:auto 0 6px;font-variant-numeric:tabular-nums}
.target{font-size:12px;color:var(--lamp);margin:0 0 4px}
.when{font-size:13px;color:var(--muted);margin:0 0 12px}
.when b{color:var(--paper);font-weight:600}
.acts{display:flex;gap:8px}
.acts a,.acts button{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;padding:7px;border-radius:9px;
  border:1px solid var(--line);background:#ffffff08;cursor:pointer}
.acts a:hover,.acts button:hover{background:#ffffff14}
.acts button.sure{background:var(--alert);border-color:var(--alert);color:#fff}
.warn{font-size:12px;color:var(--alert);margin:-4px 0 10px}

.drop{animation:drop .7s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotateX(35deg)}}
.flip .box{animation:flip 1.1s cubic-bezier(.3,1.4,.5,1)}
@keyframes flip{0%{transform:rotateY(0)}45%{transform:rotateY(180deg) scale(1.06)}100%{transform:rotateY(360deg)}}
.empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:18px;padding:48px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;font:700 22px var(--display);color:var(--paper);margin-bottom:6px}

/* ---------- side panel ---------- */
aside h2{font:700 18px var(--display);margin:0 0 14px}
.panel{background:var(--wall);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px}
.timeline{list-style:none;margin:0;padding:0;max-height:460px;overflow:auto}
.timeline li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:5px}
.timeline li:last-child{border-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--dim);border:2px solid var(--wall)}
.timeline li.in::before{background:var(--lamp)} .timeline li.out::before{background:var(--alert)}
.timeline .ev{font-weight:600}
.timeline li.in .ev{color:var(--lamp)} .timeline li.out .ev{color:#FF8A9A}
.timeline .p{display:block;font-size:14px}
.timeline time{font-size:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dl a{text-align:center;text-decoration:none;padding:12px 6px;border-radius:12px;background:var(--shelf);font-weight:600;font-size:14px}
.dl a:hover{background:var(--ledge)}
.channels{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.channels span{font-size:13px;padding:4px 10px;border-radius:999px;background:#ffffff10}
.small{font-size:13px;color:var(--muted);margin:0}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--paper);color:var(--night);border-radius:14px;padding:14px 16px;box-shadow:0 18px 40px -10px #000b;
  border-left:6px solid var(--dim);animation:tin .45s cubic-bezier(.2,1.3,.4,1)}
.toast.in{border-color:var(--lamp)} .toast.out{border-color:var(--alert)}
.toast b{display:block;font:700 15px var(--display)} .toast span{font-size:13px}
@keyframes tin{from{opacity:0;transform:translateY(20px) scale(.95)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.box{transform:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="cube" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><h1>Restock Watch</h1></div>
  <div class="pulse" id="pulse" role="status" aria-live="polite"><span class="dot"></span><span id="pulseText">Connecting…</span></div>
  <button class="btn" id="alertsBtn" aria-pressed="false">Turn on pop-up alerts</button>
  <button class="btn primary" id="checkBtn">Check now</button>
  <div class="bar" id="bar"></div>
</header>

<main>
  <section>
    <form class="add" id="addForm" autocomplete="off">
      <input class="url" name="url" type="url" placeholder="Paste a product link from Amazon, Flipkart, Myntra…" required aria-label="Product link">
      <input name="name" placeholder="Name (optional)" aria-label="Product name">
      <input name="target" inputmode="numeric" placeholder="Alert below ₹" aria-label="Alert when price drops below">
      <button class="btn primary" type="submit">Start watching</button>
    </form>
    <p class="hint" id="hint">It checks the new product within a few seconds, then every few minutes.</p>

    <div class="filters" role="group" aria-label="Show">
      <button class="chip" data-f="all" aria-pressed="true">All <span id="cAll"></span></button>
      <button class="chip" data-f="in" aria-pressed="false">In stock <span id="cIn"></span></button>
      <button class="chip" data-f="out" aria-pressed="false">Out of stock <span id="cOut"></span></button>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>

  <aside>
    <div class="panel">
      <h2>What changed</h2>
      <ul class="timeline" id="timeline"></ul>
    </div>
    <div class="panel">
      <h2>Reports</h2>
      <div class="dl"><a href="/excel">Excel</a><a href="/pdf">PDF</a><a href="/csv">CSV</a></div>
    </div>
    <div class="panel">
      <h2>Where alerts go</h2>
      <div class="channels" id="channels"></div>
      <p class="small" style="margin-bottom:12px">Add Telegram, WhatsApp, Google Chat or email in config.yaml.</p>
      <button class="btn" id="testBtn" style="width:100%">Send a test alert</button>
    </div>
  </aside>
</main>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data = null, filter = "all", firstLoad = true, lastEventKey = null, prevStatus = {}, clockOffset = 0, nextAt = null;
let alertsOn = false, shelfSig = "";
try { alertsOn = localStorage.getItem("alerts") === "1"; } catch (e) {}

const parseT = s => { const [d,t] = s.split(" "); const [y,m,dd] = d.split("-"); const [h,mi,se] = t.split(":"); return new Date(y, m-1, dd, h, mi, se).getTime(); };
const serverNow = () => Date.now() - clockOffset;
function ago(since){
  if (!since) return "";
  let s = Math.max(0, (serverNow() - parseT(since)) / 1000);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m} min` : "just now";
}
const nice = s => s ? new Date(parseT(s)).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) : "";
const cls = st => st === "IN STOCK" ? "in" : st === "OUT OF STOCK" ? "out" : "unk";

async function load(){
  try {
    const r = await fetch("/api/state"); data = await r.json();
    clockOffset = Date.now() - parseT(data.now);
    nextAt = data.next_check_in != null ? Date.now() + data.next_check_in*1000 : null;
    render(); detectChanges(); pulse();
  } catch (e) { $("#pulseText").textContent = "Tracker is not running – start it again"; }
  setTimeout(load, data?.progress?.running ? 1500 : 4000);
}

function render(){
  const ps = data.products;
  $("#cAll").textContent = ps.length;
  $("#cIn").textContent = ps.filter(p => p.status === "IN STOCK").length;
  $("#cOut").textContent = ps.filter(p => p.status === "OUT OF STOCK").length;
  const shown = ps.filter(p => filter === "all" || cls(p.status) === filter);
  const shelf = $("#shelf");
  const sig = filter + JSON.stringify(shown.map(p => [p.url, p.status, p.price, p.since, p.fails, p.name]));
  if (sig === shelfSig && !firstLoad){ shelf.querySelectorAll(".slot").forEach(updateAgo); }
  else { shelfSig = sig;
  if (!ps.length){ shelf.innerHTML = `<div class="empty"><strong>Your shelf is empty</strong>Paste a product link above and it will appear here.</div>`; }
  else if (!shown.length){ shelf.innerHTML = `<div class="empty"><strong>Nothing here</strong>No products match this filter right now.</div>`; }
  else {
    const existing = new Set([...shelf.querySelectorAll(".slot")].map(n => n.dataset.url));
    shelf.innerHTML = shown.map((p, i) => card(p, i, firstLoad || !existing.has(p.url))).join("");
    shelf.querySelectorAll(".slot").forEach(tilt);
  } }
  $("#timeline").innerHTML = data.events.length ? data.events.map(e => {
    const c = e.new_status === "IN STOCK" ? "in" : "out";
    const label = e.event.startsWith("FIRST") ? (c === "in" ? "Available" : "Not available") : e.event === "BACK IN STOCK" ? "Back in stock" : "Went out of stock";
    return `<li class="${c}"><span class="ev">${label}</span><span class="p">${esc(e.product)}</span><time>${nice(e.date+" "+e.time)} on ${esc(e.site)}${e.price?" at "+esc(e.price):""}</time></li>`;
  }).join("") : `<li><span class="p">Changes will show up here with the exact date and time.</span></li>`;
  $("#channels").innerHTML = data.channels.map(c => `<span>${esc(c)}</span>`).join("") || "<span>None yet</span>";
  firstLoad = false;
}

function card(p, i, animate){
  const c = cls(p.status);
  const lamp = c === "in" ? "In stock" : c === "out" ? "Out of stock" : p.status === "NOT CHECKED" ? "Checking soon" : "Couldn't read page";
  const when = c === "in" ? `Available for <b>${ago(p.since)}</b>, since ${nice(p.since)}`
             : c === "out" ? `Out of stock since <b>${nice(p.since)}</b>` : "Waiting for the first check";
  const href = /^https?:\/\//.test(p.url) ? esc(p.url) : "#";
  return `<div class="slot ${c} ${animate ? "drop" : ""}" data-url="${esc(p.url)}" style="--i:${i}">
    <div class="box">
      <div class="row"><span class="site">${esc(p.site)}</span><span class="lamp"><i></i>${lamp}</span></div>
      <h3 title="${esc(p.name)}">${esc(p.name || p.url)}</h3>
      <div class="price">${esc(p.price) || "–"}</div>${p.target ? `<p class="target">Price alert below ₹${Number(p.target).toLocaleString("en-IN")}</p>` : ""}
      <p class="when">${when}</p>
      ${p.fails >= 3 ? `<p class="warn">Site blocked the last ${p.fails} checks. It will keep trying.</p>` : ""}
      <div class="acts"><a href="${href}" target="_blank" rel="noopener">Open page</a><button data-rm="${esc(p.url)}">Remove</button></div>
    </div></div>`;
}

function updateAgo(slot){
  const p = data.products.find(x => x.url === slot.dataset.url); const b = slot.querySelector(".when b");
  if (p && b && p.status === "IN STOCK") b.textContent = ago(p.since);
}

function tilt(slot){
  const box = slot.querySelector(".box");
  slot.addEventListener("pointermove", e => {
    const r = slot.getBoundingClientRect();
    box.style.setProperty("--ry", ((e.clientX - r.left)/r.width - .5) * 16 + "deg");
    box.style.setProperty("--rx", -((e.clientY - r.top)/r.height - .5) * 14 + "deg");
  });
  slot.addEventListener("pointerleave", () => { box.style.setProperty("--rx","0deg"); box.style.setProperty("--ry","0deg"); });
}

function detectChanges(){
  const key = data.events[0] ? data.events[0].date + data.events[0].time + data.events[0].product : "";
  if (lastEventKey !== null && key !== lastEventKey){
    const fresh = [];
    for (const e of data.events){ if (e.date + e.time + e.product === lastEventKey) break; fresh.push(e); }
    fresh.reverse().forEach(e => announce(e));
  }
  lastEventKey = key;
}

function announce(e){
  const inS = e.new_status === "IN STOCK";
  const title = e.event.startsWith("FIRST") ? (inS ? "Available now" : "Not available right now") : inS ? "Back in stock!" : "Went out of stock";
  toast(title, `${e.product} on ${e.site}${e.price ? " – " + e.price : ""}`, inS ? "in" : "out");
  chime(inS);
  const slot = document.querySelector(`.slot[data-url="${CSS.escape(e.url)}"]`);
  if (slot){ slot.classList.remove("flip"); void slot.offsetWidth; slot.classList.add("flip"); }
  if (alertsOn && "Notification" in window && Notification.permission === "granted"){
    const n = new Notification(title, {body: `${e.product}\n${e.site}${e.price ? " – " + e.price : ""}`, tag: e.url});
    n.onclick = () => { window.open(e.url, "_blank"); n.close(); };
  }
}

function toast(title, text, kind){
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.innerHTML = `<b>${esc(title)}</b><span>${esc(text)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 7000);
}

let actx;
function chime(up){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = up ? [660, 880, 1320] : [520, 390];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i*0.13;
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.4);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.45);
    });
  } catch (e) {}
}

function pulse(){
  const p = data?.progress; const el = $("#pulse"), tx = $("#pulseText"), bar = $("#bar");
  if (!p) return;
  if (p.running){
    el.classList.add("live");
    tx.innerHTML = `Checking <b>${p.done + 1 > p.total ? p.total : p.done + 1} of ${p.total}</b>${p.current ? " – " + esc(p.current).slice(0, 30) : ""}`;
    bar.style.width = (p.total ? p.done / p.total * 100 : 5) + "%";
  } else {
    el.classList.remove("live"); bar.style.width = "0";
    if (nextAt){ const s = Math.max(0, Math.round((nextAt - Date.now())/1000));
      tx.innerHTML = `Next check in <b>${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}</b>`; }
    else tx.textContent = "Starting first check…";
  }
}
setInterval(pulse, 1000);

// ---------- actions ----------
const post = (u, b) => fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(b || {})}).then(async r => ({ok: r.ok, ...(await r.json())}));

$("#addForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = new FormData(ev.target), hint = $("#hint");
  const r = await post("/api/add", {url: f.get("url"), name: f.get("name"), target: f.get("target")});
  if (!r.ok){ hint.textContent = r.error; hint.classList.add("err"); return; }
  hint.classList.remove("err"); hint.textContent = "Added. Checking it now…";
  ev.target.reset(); toast("Watching", f.get("name") || f.get("url"), "in");
  setTimeout(load, 600);
});

$("#shelf").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-rm]"); if (!b) return;
  if (!b.classList.contains("sure")){ b.classList.add("sure"); b.textContent = "Tap again to remove";
    setTimeout(() => { b.classList.remove("sure"); b.textContent = "Remove"; }, 3000); return; }
  const slot = b.closest(".slot"); slot.style.transition = "opacity .3s, transform .3s"; slot.style.opacity = 0; slot.style.transform = "translateY(30px)";
  await post("/api/remove", {url: b.dataset.rm}); toast("Removed", "It's no longer being watched", ""); setTimeout(load, 300);
});

$("#checkBtn").addEventListener("click", async () => {
  const r = await post("/api/check"); toast(r.already ? "Already checking" : "Checking now", "Results appear on the shelf in a few seconds", "");
  setTimeout(load, 500);
});

$("#testBtn").addEventListener("click", async () => {
  const r = await post("/api/test-notify");
  chime(true);
  if (alertsOn && Notification.permission === "granted") new Notification("Test alert", {body: "Pop-up alerts are working"});
  toast("Test alert sent", r.sent && r.sent.length ? "Sent to: " + r.sent.join(", ") : "No channels set up yet in config.yaml", "in");
});

function setAlerts(on){
  alertsOn = on; try { localStorage.setItem("alerts", on ? "1" : "0"); } catch (e) {}
  const b = $("#alertsBtn"); b.setAttribute("aria-pressed", on); b.textContent = on ? "Pop-up alerts on" : "Turn on pop-up alerts";
}
$("#alertsBtn").addEventListener("click", async () => {
  if (alertsOn){ setAlerts(false); return; }
  chime(true);   // also unlocks sound in the browser
  if ("Notification" in window){
    const perm = await Notification.requestPermission();
    if (perm !== "granted") toast("Browser pop-ups are blocked", "You'll still get sound and on-screen alerts. Allow notifications for this site to get pop-ups.", "out");
  } else toast("Pop-ups not supported here", "Sound and on-screen alerts will still work", "");
  setAlerts(true);
});
setAlerts(alertsOn);

document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  filter = c.dataset.f; document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c)); firstLoad = true; render();
}));
load();
</script>
</body>
</html>
