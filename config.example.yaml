# ====================================================================
#  STOCK TRACKER SETTINGS  -  copy this file to config.yaml and edit
# ====================================================================

settings:
  timezone: Asia/Kolkata            # all dates/times in Indian time
  check_every_minutes: 5            # in-stock products: how often to check if they went OUT of stock
  fast_check_minutes: 2             # out-of-stock products: checked more often so you know the moment they're BACK
  delay_between_products_seconds: [2, 4]   # wait between 2 products of the SAME site (different sites run in parallel)
  use_browser: auto                 # auto | always | never  (auto = use real Chrome only if blocked)
  notify_on_first_check: true       # send a message the first time a product is checked
  alert_after_failures: 6           # warn you if a page can't be read this many times in a row
  daily_summary_time: "09:00"       # daily summary + Excel/PDF; remove this line to turn off
  web_port: 8787                    # dashboard port; if busy, the next free port is used automatically
  web_host: 127.0.0.1               # 127.0.0.1 = only this PC | 0.0.0.0 = also your phone on same Wi-Fi

# --------------------------------------------------------------------
#  PRODUCTS  - paste the full product page link
#  Optional per product:
#     target_price: 25000                 -> extra alert when price drops to/below this
#     in_stock_text: "Add to Cart"        -> custom text meaning "available" on that site
#     out_of_stock_text: "Sold Out"       -> custom text meaning "not available"
#     active: false                       -> pause tracking
# --------------------------------------------------------------------
products:
  - name: Example - Amazon product
    url: https://www.amazon.in/dp/B0CHX1W1XY
    target_price: 60000
  - name: Example - Flipkart product
    url: https://www.flipkart.com/apple-iphone-15-black-128-gb/p/itm6ac6485515ae4

# --------------------------------------------------------------------
#  NOTIFICATIONS - easiest: set these up on the dashboard's "Alerts" page.
#  (Everything below is filled in for you when you click Save there.)
# --------------------------------------------------------------------
notifications:
  desktop:
    enabled: true
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  whatsapp:
    enabled: false
    provider: callmebot             # callmebot (free, personal) or twilio (paid, business)
    phone: ""                       # +919876543210
    apikey: ""
  google_chat:
    enabled: false
    webhook_url: ""
  email:
    enabled: false
    smtp_server: smtp.gmail.com
    smtp_port: 587
    username: ""
    password: ""                    # Gmail App Password (16 letters), NOT your normal password
    to: []
    attach_reports: true
  ntfy:
    enabled: false
    topic: ""
